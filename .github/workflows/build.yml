name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing source ZIP"
        required: true
        type: string
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ inputs.tag }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      SOURCE_DIR: ${{ github.workspace }}/source
      LOG_DIR: ${{ github.workspace }}/build_logs

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip gh
          mkdir -p "$SOURCE_DIR" "$LOG_DIR"

      - name: Download source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --clobber
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan!"
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          rm -f "$ZIP_FILE"
          echo "✅ ZIP Extracted!"

      # ✅ CARI PUBSPEC — TANPA PIPE, PASTI JALAN WALAU ADA FOLDER TAMBAHAN! ✅
      - name: Detect Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Mencari pubspec.yaml..."
          
          mapfile -t PUBSPEC_LIST < <(find "$SOURCE_DIR" -type f -name "pubspec.yaml" \
            -not -path "*/build/*" -not -path "*/.git/*" -not -path "*/.pub/*")
          
          PUBSPEC="${PUBSPEC_LIST[0]:-}"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ ERROR: pubspec.yaml TIDAK DITEMUKAN!"
            echo "📂 Isi folder SOURCE_DIR:"
            ls -la "$SOURCE_DIR"
            echo "📂 Daftar folder:"
            find "$SOURCE_DIR" -maxdepth 2 -type d | head -n 20
            exit 1
          fi

          PROJECT_ROOT="$(cd "$(dirname "$PUBSPEC")" && pwd)"
          echo "✅ Project ditemukan di: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ Flutter 3.32.8 — Dart 3.8.1, kompatibel dengan Gradle 8.12 project ini ✅
      - name: Setup Flutter — Stable Release
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter environment check
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter clean & pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_root }}"
          flutter clean
          flutter pub get

      - name: Fix Gradle Compatibility
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_root }}/android"
          echo "android.newDsl=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "${{ steps.project.outputs.project_root }}"
          flutter build apk --${{ inputs.build_type }} --verbose

      - name: Package APK
        if: success()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk_output"
          find "${{ steps.project.outputs.project_root }}/build/app/outputs/flutter-apk" -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk_output/" \;
          ls -lh "$GITHUB_WORKSPACE/apk_output"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ github.workspace }}/apk_output/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.build_type }}
          path: ${{ github.workspace }}/build_logs/**
          if-no-files-found: warn
          
