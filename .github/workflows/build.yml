name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        type: choice
        options:
          - debug
          - release
        default: "release"
        
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.41.9"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:

      # =========================
      # ✅ CHECKOUT REPOSITORY (PENTING!)
      # =========================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: "📥 Download ZIP project"
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --progress-bar \
            -w "\n=== HTTP Status: %{http_code} ===\n"

          # Check if download success
          if [ ! -f "project.zip" ]; then
            echo "❌ ZIP download failed"
            exit 1
          fi

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: "📦 Extract ZIP"
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file (first 100 bytes) ==="
            head -c 100 project.zip | od -c
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw ==="
          find project_raw -type f | head -20

          echo ""
          echo "=== Detecting Project Directory ==="
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          # Verify pubspec.yaml exists
          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          echo "✅ pubspec.yaml found"

      # =========================
      # JAVA
      # =========================
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # =========================
      # FLUTTER
      # =========================
      - name: "🐦 Setup Flutter"
        uses: subosito/flutter-action@main
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      # =========================
      # FLUTTER DOCTOR
      # =========================
      - name: "🔧 Flutter Doctor"
        run: flutter doctor -v

      # ==========================================================
      # 🔍 TAHAP ANALYZE
      # ==========================================================
      - name: "🔍 Analyze Project Code"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "✅ Flutter project detected"
            flutter analyze --no-fatal-infos 2>&1 | tee analyze_report.txt || true

            echo ""
            echo "=== Analysis Results ==="
            cat analyze_report.txt

          else
            echo "❌ pubspec.yaml not found - skipping analysis"
            exit 1
          fi

      # ==========================================================
      # 🔍 STOP IF ANALYZE ONLY
      # ==========================================================
      - name: "⏹️ Stop if Analyze Only"
        if: ${{ github.event.inputs.only_analyze == true }}
        run: |
          echo "✅ Analyze-only mode. Workflow completed."
          exit 0

      # ==========================================================
      # 📦 GET DEPENDENCIES
      # ==========================================================
      - name: "📋 Get dependencies"
        if: ${{ github.event.inputs.only_analyze != true }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Getting dependencies ==="
          
          if [ -f "pubspec.yaml" ]; then
            echo "Running flutter pub get..."
            timeout 180s flutter pub get || {
              echo "⚠️ First attempt failed, retrying..."
              timeout 180s flutter pub get --offline || echo "⚠️ Pub get timeout, continuing..."
            }
            echo "✅ Dependencies ready"
          else
            echo "❌ pubspec.yaml not found"
            exit 1
          fi

      # ==========================================================
      # 🚀 BUILD APK
      # ==========================================================
      - name: "🚀 Build APK"
        if: ${{ github.event.inputs.only_analyze != true }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Build Type: ${{ github.event.inputs.build_type }}"

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Flutter Project - Building..."
            
            flutter build apk --${{ github.event.inputs.build_type }} \
              --no-tree-shake-icons \
              --verbose

            echo "✅ Build completed"
            
          else
            echo "❌ pubspec.yaml not found"
            exit 1
          fi

      # =========================
      # CHECK APK OUTPUT
      # =========================
      - name: "✅ Verify APK Output"
        if: ${{ github.event.inputs.only_analyze != true }}
        run: |
          echo "=== Scanning for APK ==="

          APK_FOUND=$(find ${{ env.PROJECT_DIR }}/build -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK not found!"
            echo ""
            echo "=== Build directory contents ==="
            find ${{ env.PROJECT_DIR }}/build -type f -name "*.apk" || echo "No APK files found"
            exit 1
          fi

          echo "✅ APK found: $APK_FOUND"
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_ENV

          echo ""
          echo "=== APK Details ==="
          ls -lh "$APK_FOUND"
          file "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: "📤 Upload APK artifact"
        if: ${{ github.event.inputs.only_analyze != true }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error

      # =========================
      # SUCCESS
      # =========================
      - name: "🎉 Build Success"
        if: success() && github.event.inputs.only_analyze != true
        run: |
          echo "╔════════════════════════════════╗"
          echo "║   ✅ BUILD COMPLETED! ✅       ║"
          echo "╠════════════════════════════════╣"
          echo "║ Tag: ${{ github.event.inputs.tag }}"
          echo "║ Type: ${{ github.event.inputs.build_type }}"
          echo "║ APK: ${{ env.APK_PATH }}"
          echo "╚════════════════════════════════╝"
          
